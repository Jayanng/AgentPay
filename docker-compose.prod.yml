services:
  agentpay:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_X402_CHAIN: ${X402_CHAIN:-sepolia}
        NEXT_PUBLIC_X402_CURRENCY: ${X402_CURRENCY:-USDC}
        NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${WALLETCONNECT_PROJECT_ID}
    container_name: agentpay-app
    restart: always
    ports:
      - "3000:3000"
      - "3001:3001"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
